name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  firmware-check:
    name: ESP32 Firmware Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
        
      - name: Build ESP32 Firmware
        run: |
          cd firmware/extruder80_156
          pio run --environment esp32dev
          
      - name: Run PlatformIO Tests
        run: |
          cd firmware/extruder80_156
          pio test --environment esp32dev
          
      - name: Archive firmware binary
        uses: actions/upload-artifact@v3
        with:
          name: firmware-esp32
          path: firmware/extruder80_156/.pio/build/esp32dev/firmware.bin

  bridge-service:
    name: Bridge Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/bridge/package-lock.json
          
      - name: Install dependencies
        run: |
          cd services/bridge
          npm ci
          
      - name: Type check
        run: |
          cd services/bridge
          npm run type-check
          
      - name: Lint
        run: |
          cd services/bridge
          npm run lint
          
      - name: Run tests
        run: |
          cd services/bridge
          npm test
          
      - name: Build
        run: |
          cd services/bridge
          npm run build
          
      - name: Build Docker image
        run: |
          cd services/bridge
          docker build -t dereliplast-bridge:${{ github.sha }} .

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/app/package-lock.json
          
      - name: Install dependencies
        run: |
          cd dashboard/app
          npm ci
          
      - name: Type check
        run: |
          cd dashboard/app
          npm run type-check
          
      - name: Lint
        run: |
          cd dashboard/app
          npm run lint
          
      - name: Run tests
        run: |
          cd dashboard/app
          npm test
          
      - name: Build
        run: |
          cd dashboard/app
          npm run build
          
      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dashboard-build
          path: dashboard/app/dist

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install global tools
        run: |
          npm install -g prettier eslint
          
      - name: Check code formatting
        run: |
          npx prettier --check "services/**/*.{ts,js,json}"
          npx prettier --check "dashboard/**/*.{ts,tsx,js,jsx,json}"
          
      - name: Security audit
        run: |
          cd services/bridge && npm audit --audit-level moderate
          cd ../../dashboard/app && npm audit --audit-level moderate

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material
          
      - name: Build docs
        run: |
          mkdocs build --strict
          
      - name: Deploy docs (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdocs gh-deploy --force

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [firmware-check, bridge-service, dashboard]
    
    services:
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
          
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd services/bridge && npm ci
          pip install paho-mqtt pytest
          
      - name: Start Firebase Emulators
        run: |
          cd services/bridge
          npm install -g firebase-tools
          firebase emulators:start --only database &
          sleep 10
          
      - name: Run integration tests
        run: |
          python -m pytest tools/integration_tests.py -v
          
      - name: Test MQTT to Firebase flow
        run: |
          cd tools
          python simulator.py --test-mode &
          sleep 5
          python test_mqtt_firebase_flow.py 